apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployments.yaml
  labels:
    app: myweb

spec:
  replicas: 6

  selector:
    matchLabels:
      app: myweb

  template:
    metadata:
      labels:
        app: myweb

    spec:
      containers:
      - name: myweb
        image: cloudops2026/myimage_1:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
